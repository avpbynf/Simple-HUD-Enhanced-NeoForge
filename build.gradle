plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    // Cloth Config
    maven {
        name = "Cloth Config"
        url = "https://maven.shedaniel.me/"
    }
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Cloth Config for NeoForge (bundles AutoConfig). Compile against it...
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    // ...and embed it in the produced jar (jar-in-jar), like the Fabric build did with `include`.
    jarJar("me.shedaniel.cloth:cloth-config-neoforge") {
        version {
            strictly "[${cloth_config_version},)"
            prefer "${cloth_config_version}"
        }
    }
}

// Generate the mod metadata (neoforge.mods.toml) from a template, interpolating gradle properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            cloth_config_version   : cloth_config_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

jar {
    from("LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
}
